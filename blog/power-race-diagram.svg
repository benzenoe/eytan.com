<svg viewBox="0 0 760 820" xmlns="http://www.w3.org/2000/svg" width="760" height="820" style="font-family:system-ui,-apple-system,sans-serif;">

  <!-- Background -->
  <rect x="0" y="0" width="760" height="820" fill="#f8f9ff" rx="12"/>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#764ba2"/>
    </marker>
  </defs>

  <!-- A: Frontier AI -->
  <rect x="230" y="18" width="300" height="48" rx="8" fill="#667eea"/>
  <text text-anchor="middle" fill="white" font-size="13" font-weight="bold">
    <tspan x="380" y="38">Frontier AI /</tspan>
    <tspan x="380" dy="18">performance gains</tspan>
  </text>

  <!-- A→B arrow -->
  <line x1="380" y1="66" x2="380" y2="88" stroke="#764ba2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- B: More compute demand -->
  <rect x="255" y="92" width="250" height="42" rx="8" fill="#667eea"/>
  <text x="380" y="118" text-anchor="middle" fill="white" font-size="13" font-weight="bold">More compute demand</text>

  <!-- B→C arrow -->
  <line x1="380" y1="134" x2="380" y2="156" stroke="#764ba2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- C: More / larger data centers -->
  <rect x="210" y="160" width="340" height="42" rx="8" fill="#667eea"/>
  <text x="380" y="186" text-anchor="middle" fill="white" font-size="13" font-weight="bold">More / larger data centers</text>

  <!-- C→D arrow -->
  <line x1="380" y1="202" x2="380" y2="224" stroke="#764ba2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- D: Need for firm power -->
  <rect x="140" y="228" width="480" height="48" rx="8" fill="#667eea"/>
  <text text-anchor="middle" fill="white" font-size="13" font-weight="bold">
    <tspan x="380" y="248">Need for firm power +</tspan>
    <tspan x="380" dy="18">fast grid interconnection</tspan>
  </text>

  <!-- D→E arrow -->
  <line x1="380" y1="276" x2="380" y2="296" stroke="#764ba2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- E: Diamond "Grid can connect fast?" -->
  <polygon points="380,296 500,336 380,376 260,336" fill="#764ba2"/>
  <text text-anchor="middle" fill="white" font-size="12" font-weight="bold">
    <tspan x="380" y="330">Grid can</tspan>
    <tspan x="380" dy="17">connect fast?</tspan>
  </text>

  <!-- No branch (left) -->
  <path d="M260,336 L130,336 L130,412" stroke="#764ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="172" y="320" width="30" height="20" rx="3" fill="#f8f9ff"/>
  <text x="187" y="334" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="bold">No</text>

  <!-- Yes branch (right) -->
  <path d="M500,336 L630,336 L630,412" stroke="#764ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="548" y="320" width="34" height="20" rx="3" fill="#f8f9ff"/>
  <text x="565" y="334" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="bold">Yes</text>

  <!-- F: BYOG / microgrids -->
  <rect x="30" y="416" width="200" height="50" rx="8" fill="#5b21b6"/>
  <text text-anchor="middle" fill="white" font-size="11" font-weight="bold">
    <tspan x="130" y="436">Bring-your-own-gen /</tspan>
    <tspan x="130" dy="17">microgrids / off-grid</tspan>
  </text>

  <!-- F→H arrow -->
  <line x1="130" y1="466" x2="130" y2="488" stroke="#764ba2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- G: Standard interconnection -->
  <rect x="530" y="416" width="200" height="50" rx="8" fill="#5b21b6"/>
  <text text-anchor="middle" fill="white" font-size="11" font-weight="bold">
    <tspan x="630" y="436">Standard interconnection</tspan>
    <tspan x="630" dy="17">+ transmission upgrades</tspan>
  </text>

  <!-- G→I arrow -->
  <line x1="630" y1="466" x2="630" y2="488" stroke="#764ba2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- H: Higher local emissions -->
  <rect x="30" y="492" width="200" height="50" rx="8" fill="#5b21b6"/>
  <text text-anchor="middle" fill="white" font-size="11" font-weight="bold">
    <tspan x="130" y="512">Higher local emissions</tspan>
    <tspan x="130" dy="17">&amp; permitting fights</tspan>
  </text>

  <!-- H→J arrow -->
  <line x1="130" y1="542" x2="130" y2="564" stroke="#764ba2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- I: Rate-base pressure -->
  <rect x="530" y="492" width="200" height="50" rx="8" fill="#5b21b6"/>
  <text text-anchor="middle" fill="white" font-size="11" font-weight="bold">
    <tspan x="630" y="512">Rate-base &amp; capacity</tspan>
    <tspan x="630" dy="17">market pressure</tspan>
  </text>

  <!-- I→K arrow -->
  <line x1="630" y1="542" x2="630" y2="564" stroke="#764ba2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- J: Community resistance -->
  <rect x="30" y="568" width="200" height="50" rx="8" fill="#5b21b6"/>
  <text text-anchor="middle" fill="white" font-size="11" font-weight="bold">
    <tspan x="130" y="588">Community resistance:</tspan>
    <tspan x="130" dy="17">water, land, air, noise</tspan>
  </text>

  <!-- K: Household bills -->
  <rect x="530" y="568" width="200" height="50" rx="8" fill="#5b21b6"/>
  <text text-anchor="middle" fill="white" font-size="11" font-weight="bold">
    <tspan x="630" y="588">Household bill increases</tspan>
    <tspan x="630" dy="17">&amp; electricity inflation</tspan>
  </text>

  <!-- J→L and K→L arrows converging -->
  <path d="M130,618 L130,662 L180,662" stroke="#764ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M630,618 L630,662 L580,662" stroke="#764ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- L: Political response -->
  <rect x="180" y="648" width="400" height="50" rx="8" fill="#667eea"/>
  <text text-anchor="middle" fill="white" font-size="12" font-weight="bold">
    <tspan x="380" y="668">Political response: restrictions,</tspan>
    <tspan x="380" dy="18">cost-shifting rules</tspan>
  </text>

  <!-- L→M arrow -->
  <line x1="380" y1="698" x2="380" y2="720" stroke="#764ba2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- M: Re-acceleration -->
  <rect x="180" y="724" width="400" height="44" rx="8" fill="#667eea"/>
  <text x="380" y="751" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Re-acceleration via targeted policies</text>

  <!-- M→C loop-back (dashed) -->
  <path d="M380,768 L380,800 L14,800 L14,181 L210,181" stroke="#764ba2" stroke-width="1.8" stroke-dasharray="7,4" fill="none" marker-end="url(#arr)"/>
  <text transform="translate(6,500) rotate(-90)" text-anchor="middle" fill="#764ba2" font-size="10" font-style="italic">loops back</text>

</svg>
