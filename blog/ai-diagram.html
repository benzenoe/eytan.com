<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: transparent; }
svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 760 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#764ba2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="820" fill="#f8f9ff" rx="12"/>
  <rect x="230" y="18" width="300" height="48" rx="8" fill="#667eea"/>
  <text font-family="sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">
    <tspan x="380" y="38">Frontier AI /</tspan><tspan x="380" dy="18">performance gains</tspan>
  </text>
  <line x1="380" y1="66" x2="380" y2="88" stroke="#764ba2" stroke-width="2" marker-end="url(#a)"/>
  <rect x="255" y="92" width="250" height="42" rx="8" fill="#667eea"/>
  <text x="380" y="118" font-family="sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">More compute demand</text>
  <line x1="380" y1="134" x2="380" y2="156" stroke="#764ba2" stroke-width="2" marker-end="url(#a)"/>
  <rect x="210" y="160" width="340" height="42" rx="8" fill="#667eea"/>
  <text x="380" y="186" font-family="sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">More / larger data centers</text>
  <line x1="380" y1="202" x2="380" y2="224" stroke="#764ba2" stroke-width="2" marker-end="url(#a)"/>
  <rect x="140" y="228" width="480" height="48" rx="8" fill="#667eea"/>
  <text font-family="sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">
    <tspan x="380" y="248">Need for firm power +</tspan><tspan x="380" dy="18">fast grid interconnection</tspan>
  </text>
  <line x1="380" y1="276" x2="380" y2="296" stroke="#764ba2" stroke-width="2" marker-end="url(#a)"/>
  <polygon points="380,296 500,336 380,376 260,336" fill="#764ba2"/>
  <text font-family="sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">
    <tspan x="380" y="330">Grid can</tspan><tspan x="380" dy="17">connect fast?</tspan>
  </text>
  <path d="M260,336 L130,336 L130,412" stroke="#764ba2" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="192" y="330" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">No</text>
  <path d="M500,336 L630,336 L630,412" stroke="#764ba2" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="568" y="330" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">Yes</text>
  <rect x="30" y="416" width="200" height="50" rx="8" fill="#5b21b6"/>
  <text font-family="sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">
    <tspan x="130" y="436">Bring-your-own-gen /</tspan><tspan x="130" dy="17">microgrids / off-grid</tspan>
  </text>
  <line x1="130" y1="466" x2="130" y2="488" stroke="#764ba2" stroke-width="2" marker-end="url(#a)"/>
  <rect x="530" y="416" width="200" height="50" rx="8" fill="#5b21b6"/>
  <text font-family="sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">
    <tspan x="630" y="436">Standard interconnection</tspan><tspan x="630" dy="17">+ transmission upgrades</tspan>
  </text>
  <line x1="630" y1="466" x2="630" y2="488" stroke="#764ba2" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="492" width="200" height="50" rx="8" fill="#5b21b6"/>
  <text font-family="sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">
    <tspan x="130" y="512">Higher local emissions</tspan><tspan x="130" dy="17">&amp; permitting fights</tspan>
  </text>
  <line x1="130" y1="542" x2="130" y2="564" stroke="#764ba2" stroke-width="2" marker-end="url(#a)"/>
  <rect x="530" y="492" width="200" height="50" rx="8" fill="#5b21b6"/>
  <text font-family="sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">
    <tspan x="630" y="512">Rate-base &amp; capacity</tspan><tspan x="630" dy="17">market pressure</tspan>
  </text>
  <line x1="630" y1="542" x2="630" y2="564" stroke="#764ba2" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="568" width="200" height="50" rx="8" fill="#5b21b6"/>
  <text font-family="sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">
    <tspan x="130" y="588">Community resistance:</tspan><tspan x="130" dy="17">water, land, air, noise</tspan>
  </text>
  <rect x="530" y="568" width="200" height="50" rx="8" fill="#5b21b6"/>
  <text font-family="sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">
    <tspan x="630" y="588">Household bill increases</tspan><tspan x="630" dy="17">&amp; electricity inflation</tspan>
  </text>
  <path d="M130,618 L130,662 L180,662" stroke="#764ba2" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M630,618 L630,662 L580,662" stroke="#764ba2" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="180" y="648" width="400" height="50" rx="8" fill="#667eea"/>
  <text font-family="sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">
    <tspan x="380" y="668">Political response: restrictions,</tspan><tspan x="380" dy="18">cost-shifting rules</tspan>
  </text>
  <line x1="380" y1="698" x2="380" y2="720" stroke="#764ba2" stroke-width="2" marker-end="url(#a)"/>
  <rect x="180" y="724" width="400" height="44" rx="8" fill="#667eea"/>
  <text x="380" y="751" font-family="sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Re-acceleration via targeted policies</text>
  <path d="M380,768 L380,800 L14,800 L14,181 L210,181" stroke="#764ba2" stroke-width="2" stroke-dasharray="7,4" fill="none" marker-end="url(#a)"/>
  <text font-family="sans-serif" font-size="10" font-style="italic" fill="#764ba2" text-anchor="middle" transform="translate(6,500) rotate(-90)">loops back</text>
</svg>
</body>
</html>
